<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Grants</title>
</head>
<body>
<div th:fragment="grants">
    <div class="card">
        <div class="card-feed-list card-recent">
            <ol class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    th:if="${!grants.isEmpty()}"
                    th:each="grant: ${grants}">
                    <div class="avatar xm log">
                        <img th:src="${'https://skins.mcstats.com/skull/' + (grant.addedBy.equals('00000000-0000-0000-0000-000000000000') ? 'f78a4d8d-d51b-4b39-98a3-230f2de0c670' : grant.addedBy)}"/>
                    </div>
                    <!--/*@thymesVar id="grant" type="gg.scala.restapi.profile.grant.Grant"*/-->
                    <div class="ms-lg-3 me-auto">
                        <div class="fw-bold">
                            <a th:style="${'color: ' + grant.addedByWebColor}"
                               th:text="${grant.addedByName}"></a>
                            <a th:text="${grant.addedReason}"
                               style="color: red"></a>
                            <a th:if="${grant.getEnd() != -1}"
                               th:text="' for a period of ' + ${grant.formatDuration()}"
                               style="color: silver"></a>
                        </div>

                        <div class="card-feed-meta">
                            <span th:text="${grant.getAddedAgo()}"></span>
                        </div>
                        <div th:if="${grant.isRemoved()}" style="padding-left: 10px">
                            <div class="fw-bold">
                                <a th:style="${'color: ' + grant.removerByWebColor}"
                                   th:text="${grant.removerByName}"></a>
                                <a th:text="' removed grant for '"
                                   style="color: silver"></a>
                                <a th:text="${grant.removedReason}"
                                   style="color: red"></a>
                            </div>

                            <div class="card-feed-meta">
                                <span th:text="${grant.getRemovedAgo()}"></span>
                            </div>
                        </div>
                    </div>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center"
                    style="background-color: #973333; justify-content: center !important;"
                    th:if="${grants.isEmpty()}">
                    <div class="fw-bold text-center error">This user has no grants.</div>
                </li>
            </ol>
        </div>
    </div>

    <nav aria-label="Page navigation example" th:if="${!grants.isEmpty()}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${previousPage == currentPage ? 'disabled' : ''}">
                <a class="page-link" th:href="${previousPage == currentPage ? '' : previousPageUrl}"
                   aria-disabled="true">&laquo;</a>
            </li>

            <li class="page-item">
                <a class="page-link" th:text="${currentPage}">
                </a>
            </li>

            <li class="page-item" th:classappend="${nextPage == currentPage ? 'disabled' : ''}">
                <a class="page-link" th:href="${nextPage == currentPage ? '' : nextPageUrl}"
                   aria-disabled="true">&raquo;</a>
            </li>
        </ul>
        <div class="navigation-meta" th:text="${'You are on page ' + currentPage + '/' + pageCount + '.'}">
        </div>
    </nav>

</div>
</body>
</html>
