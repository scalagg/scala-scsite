<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="@{default}"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Home</title>
</head>
<body>
<div layout:fragment="content">
    <div id="content">
        <div class="alert alert-light d-none" role="alert">
            Example Area
        </div>

        <div id="news-collection" th:if="${latestAnnouncement != null}">
            <div class="news-post large">
                <a th:href="${'/thread/' + latestAnnouncement.getId()}" class="news-image">
                    <img th:src="${!latestAnnouncement.getImageUrl().isEmpty() ? latestAnnouncement.getImageUrl() : 'https://i.imgur.com/IKgsTdb.jpeg'}">
                </a>

                <div class="news-text">
                    <a th:href="${'/thread/' + latestAnnouncement.getId()}" class="news-title">
                        <th:block th:utext="${latestAnnouncement.getTitle()}"/>
                        <span>Latest</span>
                    </a>

                    <div class="news-desc" th:utext="${latestAnnouncement.getContent()}"></div>

                    <div class="user-meta">
                        <div class="avatar">
                            <img th:src="${'https://skins.mcstats.com/skull/' + latestAnnouncement.getAuthor()}">
                        </div>

                        <a th:href="${'/u/' + latestAnnouncement.getAuthorName()}"
                           th:text="${latestAnnouncement.getAuthorName()}"
                           th:style="${'color: ' + latestAnnouncement.getAuthorWebColor() + ' !important'}">
                        </a>

                        <span th:text="${latestAnnouncement.getPostedAgo()}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div id="news-collection" class="small two" th:if="${announcements != null && !announcements.isEmpty()}">
            <div class="news-post" th:each="announcement: ${announcements}">
                <a th:href="${'/thread/' + announcement.getId()}" class="news-image">
                    <img th:src="${!announcement.getImageUrl().isEmpty() ? announcement.getImageUrl() : 'https://i.imgur.com/IKgsTdb.jpeg'}">
                </a>
                <div class="news-text">
                    <a th:href="${'/thread/' + announcement.getId()}" class="news-title"
                       th:text="${announcement.getTitle()}">
                    </a>

                    <div class="news-desc" th:utext="${announcement.getContent()}"></div>

                    <div class="user-meta">
                        <div class="avatar">
                            <img th:src="${'https://skins.mcstats.com/skull/' + announcement.getAuthor()}">
                        </div>

                        <a th:href="${'/u/' + announcement.getAuthorName()}"
                           th:text="${announcement.getAuthorName()}"
                           th:style="${'color: ' + announcement.getAuthorWebColor() + ' !important'}">
                        </a>

                        <span th:text="${announcement.getPostedAgo()}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <div class="server-status">scala.gg <div class="count" th:text="${playerCount} + ' ONLINE'"></div></div>
        <div id="discord" class="dark-only">
            <iframe src="https://discord.com/widget?id=999774017223409714&theme=dark" width="100%" height="350" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
        </div>
        <div id="discord" class="light-only">
            <iframe src="https://discord.com/widget?id=999774017223409714&theme=light" width="100%" height="350" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
        </div>
        <div id="twitter" class="light-only">
            <a class="twitter-timeline" data-height="330" href="https://twitter.com/ScalaStudios?ref_src=twsrc%5Etfw"></a> <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
        </div>
        <div id="twitter" class="dark-only">
            <a class="twitter-timeline" data-height="330" data-theme="dark" href="https://twitter.com/ScalaStudios?ref_src=twsrc%5Etfw"></a> <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
        </div>
    </div>
</div>
</body>
</html>
